document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   BENNY BAR — restaurant portfolio\n   Ink line-art on warm paper, single yellow spot color.\n   ============================================================ */\n\n:root{\n  --paper:      #f7f3e8;\n  --paper-deep: #efe8d4;\n  --ink:        #211f1a;\n  --ink-soft:   #5a564c;\n  --yellow:     #f6e04b;\n  --yellow-deep:#efce2f;\n  --yellow-soft:#fbef9c;\n  --shadow:     rgba(33,31,26,.10);\n  --font-neon:  \"Yellowtail\", cursive;\n  --font-hand:  \"Caveat\", cursive;\n  --font-ui:    \"Shantell Sans\", \"Caveat\", cursive;\n}\n\n*{ box-sizing:border-box; margin:0; padding:0; }\n\nhtml,body{\n  min-height:100%;\n  background:var(--paper);\n  color:var(--ink);\n  font-family:var(--font-ui);\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n  cursor:default;\n}\nhtml{ scroll-behavior:auto; }\nbody{ overflow-x:hidden; }\n\n/* faint paper grain */\nbody::before{\n  content:\"\";\n  position:fixed; inset:0; z-index:9999; pointer-events:none;\n  opacity:.05;\n  background-image:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\u002Ffilter><rect width='100%25' height='100%25' filter='url(%23n)'/><\u002Fsvg>\");\n  mix-blend-mode:multiply;\n}\n\n/* ---------- stage / world / scenes (horizontal camera) ---------- */\n#stage{ position:fixed; inset:0; overflow:hidden; background:var(--paper); }\n#world{\n  position:absolute; top:0; left:0; width:0; height:0;\n  will-change:transform; transform:translate3d(0,0,0);\n}\n.scene{\n  position:absolute; width:100vw; height:100vh; overflow:hidden;\n}\n.scene > svg.art{\n  position:absolute; inset:0; width:100%; height:100%; display:block;\n}\n.par{ will-change:transform; }\n\n/* ---------- intro / résumé page (gated entry) ---------- */\n#intro{\n  position:fixed; inset:0; z-index:300;\n  background:var(--paper);\n  display:flex; flex-direction:column; align-items:center; justify-content:center;\n  gap:28px; padding:84px 28px 150px; text-align:center;\n  transition:transform .9s cubic-bezier(.7,.02,.2,1), opacity .9s ease;\n}\n#intro.left{ transform:translateY(-104%); opacity:0; pointer-events:none; }\n\n.intro-card{\n  width:min(720px,100%);\n  background:var(--paper);\n  border:3px solid var(--ink);\n  border-radius:14px;\n  box-shadow:10px 12px 0 var(--shadow);\n  padding:34px 36px 30px;\n  text-align:left;\n}\n.intro-head{ display:flex; align-items:center; gap:26px; }\n.avatar{\n  width:124px; height:124px; flex:0 0 auto;\n  border-radius:50%; overflow:hidden;\n  border:3px solid var(--ink);\n  box-shadow:4px 4px 0 var(--shadow);\n}\n.avatar svg{ width:100%; height:100%; display:block; }\n.intro-eyebrow{\n  display:inline-flex; align-items:center; gap:9px;\n  font-weight:700; font-size:12.5px; letter-spacing:3px;\n  text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px;\n}\n.intro-eyebrow .eb-dot{ width:9px; height:9px; border-radius:50%; background:var(--yellow-deep); border:2px solid var(--ink); }\n.intro-name{ font-family:var(--font-neon); font-weight:400; font-size:clamp(48px,7vw,76px); line-height:.9; margin-bottom:4px; }\n.intro-role{ font-weight:700; font-size:clamp(14px,2vw,18px); letter-spacing:1.2px; text-transform:uppercase; margin-bottom:13px; }\n.intro-facts{ display:flex; flex-wrap:wrap; gap:7px 18px; font-size:14px; color:var(--ink-soft); }\n.intro-facts b{ color:var(--ink); font-weight:700; }\n.intro-bio{ font-size:clamp(15px,1.7vw,17px); line-height:1.62; color:var(--ink); text-wrap:pretty; margin:22px 2px 24px; }\n.intro-actions{ display:flex; flex-wrap:wrap; gap:14px; }\n\n.btn-primary{\n  font-family:var(--font-ui); font-weight:700; font-size:16px;\n  color:var(--ink); background:var(--yellow);\n  border:2.5px solid var(--ink); border-radius:26px;\n  padding:12px 26px; cursor:pointer;\n  box-shadow:4px 4px 0 var(--ink);\n  transition:transform .14s ease, box-shadow .14s ease;\n}\n.btn-primary:hover{ transform:translate(-1px,-1px); box-shadow:6px 6px 0 var(--ink); }\n.btn-primary:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }\n.btn-ghost{\n  font-family:var(--font-ui); font-weight:700; font-size:16px; color:var(--ink);\n  background:var(--paper); border:2.5px solid var(--ink); border-radius:26px;\n  padding:12px 26px; cursor:pointer; box-shadow:4px 4px 0 var(--shadow);\n  transition:transform .14s ease, box-shadow .14s ease, background .14s ease;\n}\n.btn-ghost:hover{ background:var(--paper-deep); transform:translate(-1px,-1px); box-shadow:6px 6px 0 var(--shadow); }\n\n/* the \"come see the chef in action\" invitation */\n.enter{\n  position:absolute; left:50%; bottom:54px; transform:translateX(-50%);\n  display:flex; flex-direction:column; align-items:center; gap:10px;\n  background:none; border:none; cursor:pointer; padding:6px 12px;\n  font-family:var(--font-hand); color:var(--ink);\n}\n.enter-label{ font-size:25px; font-weight:700; }\n.enter-chev{\n  width:46px; height:46px; border-radius:50%;\n  border:2.5px solid var(--ink); background:var(--paper);\n  display:flex; align-items:center; justify-content:center;\n  box-shadow:3px 3px 0 var(--shadow);\n  animation:enterbob 1.7s ease-in-out infinite;\n}\n.enter-chev svg{ width:26px; height:17px; display:block; margin-top:2px; }\n.enter:hover .enter-chev{ background:var(--yellow); }\n@keyframes enterbob{\n  0%,100%{ transform:translateY(0); }\n  50%{ transform:translateY(8px); }\n}\n@media (prefers-reduced-motion: reduce){ .enter-chev{ animation:none; } }\n\n/* ---------- tech-stack modal ---------- */\n.stack-card{\n  position:relative; width:min(780px,100%); max-height:86vh; overflow:auto;\n  background:var(--paper); border:3px solid var(--ink); border-radius:8px;\n  box-shadow:10px 12px 0 rgba(33,31,26,.85);\n  padding:36px 34px 30px;\n  transform:translateY(18px) scale(.97);\n  transition:transform .3s cubic-bezier(.2,.8,.2,1);\n}\n.modal-backdrop.open .stack-card{ transform:none; }\n.stack-card h2{ font-family:var(--font-neon); font-weight:400; font-size:46px; text-align:center; margin:6px 0 2px; }\n.stack-sub{ text-align:center; font-size:14px; color:var(--ink-soft); margin-bottom:24px; }\n.stack-grid{ display:flex; flex-direction:column; gap:18px; }\n.stack-cat{\n  font-weight:800; font-size:13px; letter-spacing:2px; text-transform:uppercase;\n  color:var(--ink); border-bottom:2px dashed var(--ink); padding-bottom:6px;\n  margin-bottom:12px; opacity:.82;\n}\n.stack-items{ display:flex; flex-wrap:wrap; gap:10px; }\n.chip{\n  display:inline-flex; align-items:center; gap:9px;\n  font-weight:600; font-size:14.5px; color:var(--ink);\n  background:var(--paper); border:2px solid var(--ink); border-radius:24px;\n  padding:7px 16px 7px 9px; box-shadow:2px 2px 0 var(--shadow);\n}\n.chip-ic{ width:30px; height:30px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }\n.chip-ic svg{ width:28px; height:28px; }\n\n@media (max-width:640px){\n  .intro-head{ flex-direction:column; text-align:center; align-items:center; gap:16px; }\n  .intro-facts{ justify-content:center; }\n  .intro-card{ text-align:center; }\n  .intro-actions{ justify-content:center; }\n}\n\n/* ---------- ink helpers (used inside SVG via classes) ---------- */\n/* (stroke styling is set as SVG attributes; these are JS-side) */\n\n/* ---------- top chrome ---------- */\n.brandbar{\n  position:fixed; top:0; left:0; right:0; z-index:60;\n  display:flex; align-items:center; justify-content:space-between;\n  padding:18px 26px;\n  pointer-events:none;\n}\n.brandbar .mark{\n  font-family:var(--font-hand);\n  font-weight:700;\n  font-size:22px;\n  letter-spacing:.5px;\n  display:flex; align-items:center; gap:10px;\n  color:var(--ink);\n}\n.brandbar .mark .dot{\n  width:11px; height:11px; border-radius:50%;\n  background:var(--yellow-deep);\n  border:2px solid var(--ink);\n}\n.brandbar .contact-btn{\n  pointer-events:auto;\n  font-family:var(--font-ui);\n  font-weight:600;\n  font-size:15px;\n  color:var(--ink);\n  background:var(--paper);\n  border:2.5px solid var(--ink);\n  border-radius:22px;\n  padding:8px 18px;\n  cursor:pointer;\n  box-shadow:3px 3px 0 var(--ink);\n  transition:transform .14s ease, box-shadow .14s ease, background .14s ease;\n}\n.brandbar .contact-btn:hover{\n  background:var(--yellow);\n  transform:translate(-1px,-1px);\n  box-shadow:5px 5px 0 var(--ink);\n}\n.brandbar .contact-btn:active{\n  transform:translate(2px,2px);\n  box-shadow:1px 1px 0 var(--ink);\n}\n\n/* ---------- bottom nav (room dots) ---------- */\n.roomnav{\n  position:fixed; left:50%; bottom:26px; z-index:60;\n  transform:translateX(-50%);\n  display:flex; align-items:center; gap:6px;\n  padding:9px 16px;\n  background:rgba(247,243,232,.82);\n  backdrop-filter:blur(3px);\n  border:2.5px solid var(--ink);\n  border-radius:40px;\n  box-shadow:4px 4px 0 var(--shadow);\n}\n.roomnav button{\n  font-family:var(--font-ui);\n  font-weight:600;\n  font-size:13.5px;\n  color:var(--ink-soft);\n  background:transparent;\n  border:none;\n  padding:6px 13px;\n  border-radius:24px;\n  cursor:pointer;\n  white-space:nowrap;\n  transition:color .18s ease, background .18s ease;\n}\n.roomnav button .num{ opacity:.55; margin-right:5px; font-variant-numeric:tabular-nums; }\n.roomnav button:hover{ color:var(--ink); background:var(--paper-deep); }\n.roomnav button.active{\n  color:var(--ink);\n  background:var(--yellow);\n  box-shadow:inset 0 0 0 2px var(--ink);\n}\n\n/* ---------- scroll hint (removed — hero owns the invitation) ---------- */\n\n/* ---------- tooltip card (click a character) ---------- */\n.tipcard{\n  position:fixed; z-index:70;\n  width:248px;\n  background:var(--paper);\n  border:2.5px solid var(--ink);\n  border-radius:8px;\n  box-shadow:6px 6px 0 var(--ink);\n  padding:14px 16px 15px;\n  opacity:0; transform:translateY(8px) scale(.96);\n  pointer-events:none;\n  transition:opacity .18s ease, transform .18s ease;\n}\n.tipcard.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }\n.tipcard .ttop{ display:flex; align-items:center; gap:10px; margin-bottom:7px; }\n.tipcard .ticon{ width:34px; height:34px; flex:0 0 auto; }\n.tipcard .tname{ font-family:var(--font-hand); font-weight:700; font-size:23px; line-height:1; }\n.tipcard .trole{ font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.7px; }\n.tipcard .tnote{ font-size:14.5px; line-height:1.4; color:var(--ink); margin-top:3px; }\n.tipcard .tclose{\n  position:absolute; top:7px; right:9px;\n  border:none; background:none; cursor:pointer;\n  font-size:18px; line-height:1; color:var(--ink-soft);\n}\n.tipcard::after{ /* little pointer */\n  content:\"\"; position:absolute; bottom:-9px; left:30px;\n  width:14px; height:14px; background:var(--paper);\n  border-right:2.5px solid var(--ink); border-bottom:2.5px solid var(--ink);\n  transform:rotate(45deg);\n}\n.tipcard.below::after{\n  bottom:auto; top:-9px;\n  border-right:none; border-bottom:none;\n  border-left:2.5px solid var(--ink); border-top:2.5px solid var(--ink);\n}\n\n/* clickable character affordance */\n.clickable{ cursor:pointer; }\n\n/* the exterior critic stays hidden until he's cued in (15s after entry) */\n#exterior-critic{ opacity:0; pointer-events:none; transition:opacity .8s ease; }\n#exterior-critic.revealed{ opacity:1; pointer-events:auto; }\n@media (prefers-reduced-motion: reduce){\n  #exterior-critic{ transition:opacity .3s ease; }\n}\n\n/* ---------- contact modal ---------- */\n.modal-backdrop{\n  position:fixed; inset:0; z-index:200;\n  background:rgba(33,31,26,.42);\n  backdrop-filter:blur(2px);\n  display:flex; align-items:center; justify-content:center;\n  opacity:0; pointer-events:none;\n  transition:opacity .28s ease;\n  padding:24px;\n}\n.modal-backdrop.open{ opacity:1; pointer-events:auto; }\n.menu-card{\n  position:relative;\n  width:min(440px,100%);\n  background:var(--paper);\n  border:3px solid var(--ink);\n  border-radius:6px;\n  box-shadow:10px 12px 0 rgba(33,31,26,.85);\n  padding:34px 34px 30px;\n  transform:translateY(18px) rotate(-.5deg) scale(.97);\n  transition:transform .3s cubic-bezier(.2,.8,.2,1);\n}\n.modal-backdrop.open .menu-card{ transform:translateY(0) rotate(-.5deg) scale(1); }\n.menu-card .ribbon{\n  position:absolute; top:-15px; left:50%; transform:translateX(-50%) rotate(-1deg);\n  background:var(--yellow); border:2.5px solid var(--ink);\n  font-family:var(--font-ui); font-weight:700; font-size:13px; letter-spacing:2px;\n  text-transform:uppercase; padding:5px 18px; border-radius:4px;\n}\n.menu-card h2{\n  font-family:var(--font-neon); font-weight:400; font-size:46px; line-height:.95;\n  text-align:center; margin:10px 0 2px; color:var(--ink);\n}\n.menu-card .sub{\n  text-align:center; font-family:var(--font-ui); font-size:14px; font-weight:600;\n  letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-soft);\n  margin-bottom:18px;\n}\n.menu-card .rule{\n  height:0; border-top:2px dashed var(--ink); opacity:.55; margin:14px 2px;\n}\n.menu-list{ list-style:none; display:flex; flex-direction:column; gap:4px; }\n.menu-list a{\n  display:flex; align-items:center; gap:14px;\n  text-decoration:none; color:var(--ink);\n  padding:11px 10px; border-radius:6px;\n  transition:background .15s ease, transform .15s ease;\n}\n.menu-list a:hover{ background:var(--yellow-soft); transform:translateX(3px); }\n.menu-list .li-ic{\n  width:30px; height:30px; flex:0 0 auto;\n  display:flex; align-items:center; justify-content:center;\n}\n.menu-list .li-ic svg{ width:26px; height:26px; }\n.menu-list .li-txt{ display:flex; flex-direction:column; line-height:1.15; }\n.menu-list .li-lab{ font-weight:700; font-size:16px; }\n.menu-list .li-val{ font-size:13px; color:var(--ink-soft); word-break:break-all; }\n.menu-list .li-dots{\n  flex:1 1 auto; border-bottom:2px dotted var(--ink); opacity:.3; margin:0 4px 4px;\n}\n.menu-card .close{\n  position:absolute; top:12px; right:14px;\n  width:34px; height:34px; border-radius:50%;\n  border:2.5px solid var(--ink); background:var(--paper);\n  font-size:18px; line-height:1; cursor:pointer; color:var(--ink);\n  display:flex; align-items:center; justify-content:center;\n  transition:background .15s ease, transform .15s ease;\n}\n.menu-card .close:hover{ background:var(--yellow); transform:rotate(90deg); }\n.menu-card .footnote{\n  text-align:center; font-family:var(--font-hand); font-size:18px;\n  color:var(--ink-soft); margin-top:16px;\n}\n\n/* loading splash */\n#splash{\n  position:fixed; inset:0; z-index:500; background:var(--paper);\n  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px;\n  transition:opacity .6s ease;\n}\n#splash.gone{ opacity:0; pointer-events:none; }\n#splash .s-name{ font-family:var(--font-neon); font-size:54px; color:var(--ink); white-space:nowrap; }\n#splash .s-load{ font-family:var(--font-hand); font-size:20px; color:var(--ink-soft); }\n#splash .s-bar{ width:160px; height:8px; border:2px solid var(--ink); border-radius:6px; overflow:hidden; }\n#splash .s-bar i{ display:block; height:100%; width:0; background:var(--yellow-deep); animation:load 1.1s ease forwards; }\n@keyframes load{ to{ width:100%; } }\n\n@media (max-width:680px){\n  .brandbar .mark{ font-size:18px; }\n  .roomnav button{ font-size:11.5px; padding:6px 9px; }\n  .roomnav button .num{ display:none; }\n  .hint{ display:none; }\n  .menu-card h2{ font-size:38px; }\n}\n\n/* ============================================================\n   THE CRITIC — intro animation overlay\n   ============================================================ */\n#critic-overlay{\n  position:fixed; inset:0; z-index:450;\n  display:flex; align-items:flex-end; justify-content:center;\n  opacity:0; pointer-events:none;\n  transition:opacity .6s ease;\n}\n#critic-overlay.show{ opacity:1; pointer-events:auto; }\n.critic-backdrop{\n  position:absolute; inset:0;\n  background:radial-gradient(120% 90% at 30% 80%, rgba(33,31,26,.32), rgba(33,31,26,.62));\n  backdrop-filter:blur(3px);\n}\n.critic-close{\n  position:absolute; top:18px; right:20px; z-index:3;\n  width:42px; height:42px; border-radius:50%;\n  border:2.5px solid var(--ink); background:var(--paper);\n  font-size:22px; line-height:1; cursor:pointer; color:var(--ink);\n  display:flex; align-items:center; justify-content:center;\n  box-shadow:3px 3px 0 rgba(33,31,26,.5);\n  transition:background .15s ease, transform .15s ease;\n}\n.critic-close:hover{ background:var(--yellow); transform:rotate(90deg); }\n\n.critic-stage{\n  position:relative; z-index:2;\n  width:min(1180px,100%); height:100%;\n  display:grid; grid-template-columns:minmax(0,1.05fr) minmax(340px,420px);\n  align-items:end; gap:10px;\n  padding:0 40px;\n}\n\n/* the critic rises up from the bottom as he fades in */\n.critic-figure{\n  align-self:end; height:min(88vh,860px); position:relative;\n  transform:translateY(40px); opacity:0;\n  transition:transform .9s cubic-bezier(.2,.8,.2,1) .15s, opacity .8s ease .15s;\n}\n#critic-overlay.show .critic-figure{ transform:translateY(0); opacity:1; }\n.critic-art{ height:100%; width:auto; display:block; }\n\n/* his speech bubble */\n.critic-speech{\n  position:absolute; left:clamp(220px,30%,420px); top:12%;\n  background:var(--paper); border:2.5px solid var(--ink); border-radius:16px;\n  padding:11px 16px; font-family:var(--font-hand); font-weight:700; font-size:20px;\n  color:var(--ink); box-shadow:4px 4px 0 rgba(33,31,26,.4);\n  opacity:0; transform:scale(.9) translateY(6px); transform-origin:left bottom;\n  transition:opacity .35s ease .7s, transform .35s cubic-bezier(.2,.9,.3,1.3) .7s;\n}\n.critic-speech::after{\n  content:\"\"; position:absolute; left:30px; bottom:-12px;\n  width:18px; height:18px; background:var(--paper);\n  border-right:2.5px solid var(--ink); border-bottom:2.5px solid var(--ink);\n  transform:rotate(35deg);\n}\n#critic-overlay.show .critic-speech{ opacity:1; transform:scale(1) translateY(0); }\n\n/* the review letter pops in a beat after he appears */\n.review-letter{\n  position:relative; align-self:center;\n  background:var(--paper); border:3px solid var(--ink); border-radius:8px;\n  box-shadow:12px 14px 0 rgba(33,31,26,.55);\n  padding:24px 26px 22px; margin-bottom:5vh;\n  max-height:92vh; overflow:auto;\n  overscroll-behavior:contain;\n  scrollbar-width:thin;\n  scrollbar-color:var(--ink) var(--paper-deep);\n  transform:translateY(26px) rotate(1.2deg) scale(.95); opacity:0;\n  transition:transform .55s cubic-bezier(.2,.85,.25,1.05) 1s, opacity .5s ease 1s;\n}\n.review-letter::-webkit-scrollbar{ width:10px; }\n.review-letter::-webkit-scrollbar-track{ background:transparent; }\n.review-letter::-webkit-scrollbar-thumb{\n  background:rgba(33,31,26,.22);\n  border-radius:99px;\n  border:3px solid transparent;\n  background-clip:padding-box;\n}\n.review-letter:hover::-webkit-scrollbar-thumb{ background:rgba(33,31,26,.38); background-clip:padding-box; }\n.review-letter::-webkit-scrollbar-thumb:hover{ background:rgba(33,31,26,.55); background-clip:padding-box; }\n#critic-overlay.show .review-letter{ transform:translateY(0) rotate(1.2deg) scale(1); opacity:1; }\n.review-letter .rl-pin{\n  position:absolute; top:-11px; left:50%; transform:translateX(-50%);\n  width:18px; height:18px; border-radius:50%;\n  background:var(--yellow-deep); border:2.5px solid var(--ink);\n  box-shadow:2px 2px 0 rgba(33,31,26,.35);\n}\n.rl-kick{\n  display:flex; align-items:center; gap:10px;\n  font-weight:800; font-size:12px; letter-spacing:2.5px; text-transform:uppercase;\n  color:var(--ink); border-bottom:2px dashed var(--ink); padding-bottom:11px; margin-bottom:14px;\n}\n.rl-kick .rl-stars{ color:var(--yellow-deep); -webkit-text-stroke:.6px var(--ink); letter-spacing:1px; font-s
